<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIAZI-MD | Update</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    /* RGB Background */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background:
        radial-gradient(circle, rgba(255,0,0,.15), transparent 30%),
        radial-gradient(circle, rgba(0,255,255,.12), transparent 30%),
        radial-gradient(circle, rgba(0,0,255,.15), transparent 30%);
      animation: rgbbg 6s linear infinite;
      z-index: -1;
    }

    @keyframes rgbbg {
      0% {
        transform: rotate(0deg);
        filter: hue-rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
        filter: hue-rotate(360deg);
      }
    }

    .container {
      width: 92%;
      max-width: 900px;
      text-align: center;
      padding: 30px 20px;
      border: 2px solid transparent;
      border-radius: 25px;
      background:
        linear-gradient(#050505, #050505) padding-box,
        linear-gradient(90deg, red, blue, cyan, lime, magenta, red) border-box;
      animation: borderRGB 3s linear infinite;
      box-shadow:
        0 0 20px rgba(255,0,0,.4),
        0 0 40px rgba(0,150,255,.3);
    }

    @keyframes borderRGB {
      0% {
        filter: hue-rotate(0deg);
      }
      100% {
        filter: hue-rotate(360deg);
      }
    }

    .title {
      font-size: clamp(45px, 9vw, 100px);
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      animation: textRGB 2s linear infinite;
      text-shadow:
        0 0 10px currentColor,
        0 0 25px currentColor;
    }

    @keyframes textRGB {
      0%   { color: red; }
      20%  { color: yellow; }
      40%  { color: lime; }
      60%  { color: cyan; }
      80%  { color: blue; }
      100% { color: magenta; }
    }

    .wait {
      margin-top: 15px;
      font-size: clamp(25px, 5vw, 55px);
      font-weight: bold;
      color: white;
      text-transform: uppercase;
      text-shadow: 0 0 15px #00ffff;
    }

    .image-box {
      margin: 30px auto 20px;
      width: 100%;
      max-width: 700px;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #00ffff;
      box-shadow:
        0 0 15px #00ffff,
        0 0 30px #ff00ff;
    }

    .image-box img {
      width: 100%;
      display: block;
    }

    .brand {
      margin-top: 25px;
      font-size: clamp(30px, 6vw, 65px);
      font-weight: 900;
      letter-spacing: 8px;
      animation: textRGB 2s linear infinite;
    }

    .line {
      margin: 15px auto;
      width: 70%;
      height: 3px;
      background: linear-gradient(
        90deg,
        red,
        yellow,
        lime,
        cyan,
        blue,
        magenta,
        red
      );
      background-size: 300% 100%;
      animation: moveRGB 2s linear infinite;
    }

    @keyframes moveRGB {
      from {
        background-position: 0%;
      }
      to {
        background-position: 300%;
      }
    }

    .small {
      color: #aaa;
      font-size: 14px;
      margin-top: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      ERROR
    </div>

    <div class="wait">
      NEW UPDATE<br>
      WAIT FOR 2 DAYS
    </div>

    <div class="image-box">
      <img
        src="https://cdn.phototourl.com/free/2026-08-29-1ed450fe-a722-47e2-bff2-bbaf6ae113fb.jpg"
        alt="NIAZI-MD">
    </div>

    <div class="line"></div>

    <div class="brand">
       NIAZI-MD
    </div>

    <div class="small">
      NEW UPDATE COMING SOON...
    </div>

  </div>

</body>
</html>
