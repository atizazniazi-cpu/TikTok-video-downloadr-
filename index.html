<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MIAN X NIAZI - Video Downloader</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  overflow-x:hidden;
}

/* RGB BACKGROUND */
body:before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 15% 20%,#ff0055 0,transparent 25%),
    radial-gradient(circle at 85% 20%,#00eaff 0,transparent 25%),
    radial-gradient(circle at 50% 90%,#8a00ff 0,transparent 30%),
    #050505;
  filter:blur(25px);
  opacity:.45;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:rgba(0,0,0,.68);
}

/* RGB RAIN */
#rain{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  pointer-events:none;
  opacity:.16;
}

.drop{
  position:absolute;
  top:-200px;
  font-family:monospace;
  font-size:13px;
  line-height:18px;
  animation:rain linear infinite;
  text-shadow:
    0 0 5px #00ffff,
    0 0 10px #ff00ff;
}

@keyframes rain{
  from{transform:translateY(-200px)}
  to{transform:translateY(120vh)}
}

/* HEADER */
header{
  text-align:center;
  padding:30px 15px 15px;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
  animation:rgbText 3s linear infinite;
}

@keyframes rgbText{
  0%{text-shadow:0 0 8px #ff0055}
  33%{text-shadow:0 0 12px #00ffff}
  66%{text-shadow:0 0 12px #7d00ff}
  100%{text-shadow:0 0 8px #ff0055}
}

.subtitle{
  margin-top:8px;
  color:#aaa;
  font-size:13px;
}

/* MODE */
.mode{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:20px 10px;
}

.mode button{
  position:relative;
  padding:12px 25px;
  border-radius:30px;
  border:1px solid #555;
  background:#111;
  color:white;
  cursor:pointer;
  font-weight:bold;
  overflow:hidden;
}

.mode button:before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-1;
  background:linear-gradient(
    90deg,
    #ff0055,
    #ffea00,
    #00ff88,
    #00eaff,
    #7d00ff,
    #ff0055
  );
  background-size:400%;
  animation:rgb 5s linear infinite;
}

.mode button.active{
  box-shadow:
    0 0 10px #00eaff,
    0 0 25px #ff00ff;
}

@keyframes rgb{
  0%{background-position:0%}
  100%{background-position:400%}
}

/* MAIN */
.container{
  width:92%;
  max-width:650px;
  margin:auto;
}

.box{
  position:relative;
  padding:25px;
  border-radius:22px;
  background:#0b0b0b;
  border:1px solid #333;
  box-shadow:
    0 0 15px #ff005522,
    0 0 30px #00eaff22;
  overflow:hidden;
}

.box:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(
    90deg,
    #ff0055,
    #ffea00,
    #00ff88,
    #00eaff,
    #7d00ff,
    #ff0055
  );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.title{
  text-align:center;
  font-size:25px;
  font-weight:900;
  margin-bottom:8px;
}

.desc{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-bottom:20px;
}

/* FORM */
form{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#151515;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#00eaff;
  box-shadow:0 0 12px #00eaff44;
}

.downloadBtn{
  position:relative;
  border:0;
  border-radius:12px;
  padding:0 22px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
  overflow:hidden;
}

.downloadBtn:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #ff0055,
    #7d00ff,
    #00eaff,
    #00ff88,
    #ffea00,
    #ff0055
  );
  background-size:400%;
  animation:rgb 4s linear infinite;
  z-index:0;
}

.downloadBtn span{
  position:relative;
  z-index:1;
}

/* MESSAGE */
.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  background:#151515;
  color:#ff7777;
  font-size:13px;
}

.message.show{
  display:block;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  padding:25px;
  color:#00eaff;
}

.loading.show{
  display:block;
}

/* RESULT */
.result{
  display:none;
  margin-top:20px;
}

.result.show{
  display:block;
}

.videoBox{
  border-radius:16px;
  overflow:hidden;
  background:#000;
  border:1px solid #333;
  box-shadow:
    0 0 15px #00eaff33,
    0 0 25px #ff00ff22;
}

video{
  width:100%;
  display:block;
  max-height:600px;
  background:#000;
}

.info{
  padding:15px 2px;
}

.info h3{
  font-size:16px;
}

.info p{
  color:#888;
  font-size:12px;
  margin-top:5px;
}

/* BUTTONS */
.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.action{
  flex:1;
  min-width:130px;
  border:1px solid #444;
  border-radius:12px;
  padding:14px 10px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.action:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #ff0055,
    #7d00ff,
    #00eaff,
    #00ff88,
    #ffea00
  );
  background-size:400%;
  animation:rgb 5s linear infinite;
  opacity:.8;
}

.action span{
  position:relative;
  z-index:2;
}

.action:hover{
  transform:translateY(-2px);
  box-shadow:0 0 15px #00eaff55;
}

/* SOCIAL */
.social{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:25px 0;
}

.social a{
  text-decoration:none;
  color:white;
  background:#111;
  border:1px solid #333;
  border-radius:25px;
  padding:10px 17px;
  font-size:13px;
}

/* IMAGE */
.photo{
  width:100%;
  border-radius:18px;
  margin-top:10px;
  border:1px solid #333;
}

/* FEATURES */
.features{
  width:92%;
  max-width:800px;
  margin:25px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.feature{
  background:#0b0b0b;
  border:1px solid #333;
  border-radius:15px;
  padding:18px 8px;
  text-align:center;
}

.feature b{
  display:block;
  margin-bottom:7px;
}

.feature span{
  color:#777;
  font-size:11px;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
  font-size:12px;
}

@media(max-width:600px){

  form{
    flex-direction:column;
  }

  .downloadBtn{
    height:50px;
  }

  .features{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div id="rain"></div>

<header>
  <div class="logo">MIAN X NIAZI</div>
  <div class="subtitle">
    TikTok & Instagram Video Downloader
  </div>
</header>

<div class="mode">

  <button
    id="tikMode"
    class="active"
    onclick="changeMode('tiktok')">
    🎵 TikTok
  </button>

  <button
    id="insMode"
    onclick="changeMode('instagram')">
    📸 Instagram
  </button>

</div>

<div class="container">

  <div class="box">

    <div class="title" id="title">
      TikTok Video Downloader
    </div>

    <div class="desc" id="desc">
      Paste your TikTok video link below
    </div>

    <form id="form">

      <input
        id="url"
        type="text"
        autocomplete="off"
        placeholder="Paste TikTok link here..."
      >

      <button class="downloadBtn" type="submit">
        <span>DOWNLOAD</span>
      </button>

    </form>

    <div id="message" class="message"></div>

    <div id="loading" class="loading">
      ⚡ Processing your video...
    </div>

    <div id="result" class="result">

      <div class="videoBox">
        <video
          id="video"
          controls
          playsinline
          preload="metadata">
        </video>
      </div>

      <div class="info">
        <h3 id="videoTitle">Video</h3>
        <p id="author"></p>
      </div>

      <div class="buttons">

        <button
          id="videoBtn"
          class="action">
          <span>⬇ VIDEO</span>
        </button>

        <button
          id="hdBtn"
          class="action">
          <span>⚡ HD</span>
        </button>

        <button
          id="mp3Btn"
          class="action">
          <span>🎵 MP3</span>
        </button>

      </div>

    </div>

  </div>

</div>

<div class="social">

  <a
    href="https://www.tiktok.com/"
    target="_blank">
    🎵 TikTok
  </a>

  <a
    href="https://wa.me/"
    target="_blank">
    💬 WhatsApp
  </a>

</div>

<div class="container">

  <img
    class="photo"
    src="https://cdn.phototourl.com/free/2026-08-29-1ed450fe-a722-47e2-bff2-bbaf6ae113fb.jpg"
    alt="MIAN X NIAZI">

</div>

<div class="features">

  <div class="feature">
    <b>⚡ FAST</b>
    <span>Fast video processing</span>
  </div>

  <div class="feature">
    <b>📱 MOBILE</b>
    <span>Android & iPhone support</span>
  </div>

  <div class="feature">
    <b>🆓 FREE</b>
    <span>No registration required</span>
  </div>

</div>

<footer>
  © 2026 MIAN X NIAZI
</footer>


<script>

/* =========================
   RGB RAIN
========================= */

const rain =
document.getElementById("rain");

for(let i=0;i<40;i++){

  let d =
  document.createElement("div");

  d.className="drop";

  d.innerText=
  "010101010101010101010101";

  d.style.left=
  Math.random()*100+"%";

  d.style.animationDuration=
  (6+Math.random()*12)+"s";

  d.style.animationDelay=
  (-Math.random()*15)+"s";

  rain.appendChild(d);
}


/* =========================
   VARIABLES
========================= */

let mode="tiktok";

let data=null;


/* YOUR WORKING INSTAGRAM API */
const INSTAGRAM_API =
"https://my-insta-api-seven.vercel.app/api/instagram?url=";


/* =========================
   CHANGE MODE
========================= */

function changeMode(newMode){

  mode=newMode;

  clearResult();

  document
  .getElementById("message")
  .classList.remove("show");

  if(newMode==="instagram"){

    document
    .getElementById("title")
    .innerText=
    "Instagram Video Downloader";

    document
    .getElementById("desc")
    .innerText=
    "Paste your Instagram Reel link below";

    document
    .getElementById("url")
    .placeholder=
    "Paste Instagram Reel link here...";

    document
    .getElementById("tikMode")
    .classList.remove("active");

    document
    .getElementById("insMode")
    .classList.add("active");

  }else{

    document
    .getElementById("title")
    .innerText=
    "TikTok Video Downloader";

    document
    .getElementById("desc")
    .innerText=
    "Paste your TikTok video link below";

    document
    .getElementById("url")
    .placeholder=
    "Paste TikTok link here...";

    document
    .getElementById("insMode")
    .classList.remove("active");

    document
    .getElementById("tikMode")
    .classList.add("active");
  }
}


/* =========================
   FORM
========================= */

document
.getElementById("form")
.addEventListener("submit",function(e){

  e.preventDefault();

  const input=
  document.getElementById("url");

  const url=
  input.value.trim();

  if(!url){

    showError(
      "❌ Pehle video link paste karo."
    );

    return;
  }

  /*
     INPUT KO CLEAR NAHI KARNA.
     Link yahin rahega.
  */

  if(mode==="instagram"){

    instagram(url);

  }else{

    tiktok(url);

  }

});


/* =========================
   INSTAGRAM
========================= */

async function instagram(url){

  setLoading(true);
  hideError();

  try{

    const api=
    INSTAGRAM_API+
    encodeURIComponent(url);

    const response=
    await fetch(api);

    const json=
    await response.json();

    console.log(
      "INSTAGRAM RESPONSE:",
      json
    );

    if(
      !response.ok ||
      json.status!=="success" ||
      !json.data ||
      !json.data.url
    ){

      throw new Error(
        json.message ||
        "Instagram video not found"
      );

    }

    data={
      video:json.data.url,
      hd:json.data.url,
      mp3:"",
      title:"Instagram Video",
      author:"Instagram",
      cover:json.data.thumbnail || ""
    };


    const video=
    document.getElementById("video");

    video.pause();

    video.src=
    data.video;

    if(data.cover){

      video.poster=
      data.cover;

    }

    video.load();


    document
    .getElementById("videoTitle")
    .innerText=
    data.title;

    document
    .getElementById("author")
    .innerText=
    data.author;


    document
    .getElementById("result")
    .classList.add("show");


    /*
       Instagram mein MP3/HD
       available nahi hai, isliye
       sirf VIDEO button.
    */

    document
    .getElementById("hdBtn")
    .style.display="none";

    document
    .getElementById("mp3Btn")
    .style.display="none";

    document
    .getElementById("videoBtn")
    .innerHTML=
    "<span>⬇ INSTAGRAM VIDEO</span>";


    setLoading(false);


  }catch(error){

    console.error(error);

    setLoading(false);

    showError(
      "❌ Instagram video nahi mila. Public Reel link try karo."
    );

  }

}


/* =========================
   TIKTOK
========================= */

async function tiktok(url){

  setLoading(true);
  hideError();

  try{

    let response=
    await fetch(
      "https://tikwm.com/api/?url="+
      encodeURIComponent(url)
    );

    let json=
    await response.json();

    console.log(
      "TIKWM:",
      json
    );


    if(
      json &&
      json.data &&
      json.data.play
    ){

      const x=
      json.data;

      data={
        video:x.play,
        hd:x.hdplay || x.play,
        mp3:x.music || "",
        title:x.title || "TikTok Video",
        author:x.author?.nickname || "",
        cover:x.cover || ""
      };

      showTikTokResult();

      setLoading(false);

      return;
    }


    /* SECOND API */

    response=
    await fetch(
      "https://api.tiklydown.eu.org/api/download/v5?url="+
      encodeURIComponent(url)
    );

    json=
    await response.json();

    console.log(
      "TIKLYDOWN:",
      json
    );


    const x=
    json.result ||
    json.data ||
    json;


    const video=
    x.play ||
    x.video ||
    x.videoUrl ||
    x.noWatermark;


    if(!video){

      throw new Error(
        "TikTok video not found"
      );

    }


    data={
      video:video,
      hd:x.hdplay || video,
      mp3:x.music || "",
      title:x.title || "TikTok Video",
      author:x.author?.nickname || "",
      cover:x.cover || ""
    };


    showTikTokResult();

    setLoading(false);


  }catch(error){

    console.error(error);

    setLoading(false);

    showError(
      "❌ TikTok video nahi mila."
    );

  }

}


/* =========================
   SHOW TIKTOK
========================= */

function showTikTokResult(){

  const video=
  document.getElementById("video");

  video.pause();

  video.src=
  data.video;

  if(data.cover){

    video.poster=
    data.cover;

  }

  video.load();


  document
  .getElementById("videoTitle")
  .innerText=
  data.title;

  document
  .getElementById("author")
  .innerText=
  data.author ?
  "@"+data.author :
  "";


  document
  .getElementById("result")
  .classList.add("show");


  document
  .getElementById("hdBtn")
  .style.display=
  "block";


  document
  .getElementById("mp3Btn")
  .style.display=
  data.mp3 ?
  "block" :
  "none";


  document
  .getElementById("videoBtn")
  .innerHTML=
  "<span>⬇ VIDEO</span>";
}


/* =========================
   VIDEO BUTTON
========================= */

document
.getElementById("videoBtn")
.addEventListener("click",function(){

  if(!data || !data.video){

    showError(
      "❌ Video available nahi."
    );

    return;
  }

  download(data.video,"mian-x-niazi-video.mp4");

});


/* =========================
   HD BUTTON
========================= */

document
.getElementById("hdBtn")
.addEventListener("click",function(){

  if(!data || !data.hd){

    showError(
      "❌ HD available nahi."
    );

    return;
  }

  download(data.hd,"mian-x-niazi-hd.mp4");

});


/* =========================
   MP3 BUTTON
========================= */

document
.getElementById("mp3Btn")
.addEventListener("click",function(){

  if(!data || !data.mp3){

    showError(
      "❌ MP3 available nahi."
    );

    return;
  }

  download(data.mp3,"mian-x-niazi.mp3");

});


/* =========================
   DOWNLOAD
========================= */

async function download(url,filename){

  /*
     Pehle browser se actual file
     download karne ki koshish.
  */

  try{

    const response=
    await fetch(url);

    if(!response.ok){

      throw new Error(
        "Download failed"
      );

    }

    const blob=
    await response.blob();

    const objectURL=
    URL.createObjectURL(blob);

    const a=
    document.createElement("a");

    a.href=
    objectURL;

    a.download=
    filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      ()=>{
        URL.revokeObjectURL(objectURL);
      },
      2000
    );


  }catch(error){

    /*
       Agar remote server browser ko
       direct file fetch nahi karne deta,
       direct media URL open hoga.
    */

    const a=
    document.createElement("a");

    a.href=url;

    a.target="_blank";

    a.rel="noopener";

    document.body.appendChild(a);

    a.click();

    a.remove();

  }

}


/* =========================
   LOADING
========================= */

function setLoading(show){

  const el=
  document.getElementById("loading");

  if(show){

    el.classList.add("show");

  }else{

    el.classList.remove("show");

  }

}


/* =========================
   ERROR
========================= */

function showError(text){

  const el=
  document.getElementById("message");

  el.innerText=text;

  el.classList.add("show");

}

function hideError(){

  document
  .getElementById("message")
  .classList.remove("show");

}


/* =========================
   CLEAR RESULT
========================= */

function clearResult(){

  data=null;

  const video=
  document.getElementById("video");

  video.pause();

  video.removeAttribute("src");

  video.removeAttribute("poster");

  video.load();

  document
  .getElementById("result")
  .classList.remove("show");

  /*
     Buttons reset
  */

  document
  .getElementById("hdBtn")
  .style.display="block";

  document
  .getElementById("mp3Btn")
  .style.display="block";

}

</script>

</body>
  </html>
