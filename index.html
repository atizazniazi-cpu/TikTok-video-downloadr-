
<!-- MIAN X NIAZI RED THEME + BANNER FIX -->
<style>
body {
  background:
    radial-gradient(ellipse at 10% 5%, #38202d, transparent 45%),
    radial-gradient(ellipse at 95% 90%, #350b35, transparent 48%),
    linear-gradient(135deg, #080609, #10121e 60%, #180819) !important;
  color: #fff !important;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 36px 12px 10px !important;
}

.logo {
  color: #fff !important;
  font-size: 30px !important;
  font-weight: 900 !important;
  letter-spacing: 2px;
  animation: none !important;
  text-shadow: 0 0 15px #ff285d55;
}

.subtitle {
  color: #c0aeb9 !important;
  letter-spacing: 2px;
  font-size: 10px !important;
}

.mode {
  max-width: 565px;
  margin: 18px auto 12px !important;
  gap: 7px !important;
}

.mode button {
  flex: 1;
  padding: 12px 5px !important;
  border: 1px solid #48202f !important;
  border-radius: 11px !important;
  background: #130a11 !important;
  color: #fff !important;
}

.mode button.active {
  background: linear-gradient(105deg, #ff174f, #9225d5) !important;
  border-color: transparent !important;
  box-shadow: 0 0 18px #ff174f22;
  animation: none !important;
}

.container {
  max-width: 565px !important;
}

.box {
  background: rgba(17, 7, 15, .97) !important;
  border: 1px solid #512033 !important;
  border-radius: 20px !important;
  color: #fff !important;
  padding: 24px 21px !important;
  box-shadow: none !important;
}

.box::before {
  display: none !important;
}

.title {
  color: #fff !important;
  font-size: 24px !important;
}

.desc {
  color: #b9aab4 !important;
}

label {
  color: #d9c4d0 !important;
}

input {
  background: #090609 !important;
  color: #fff !important;
  border: 1px solid #512033 !important;
  border-radius: 10px !important;
}

input::placeholder {
  color: #887984 !important;
}

.smallBtn {
  background: #21101b !important;
  color: #fff !important;
  border: 1px solid #512033 !important;
  border-radius: 9px !important;
}

.downloadBtn,
.downloadBtn.show {
  background: linear-gradient(100deg, #ff174f, #8d26d5) !important;
  color: #fff !important;
  border: 0 !important;
  border-radius: 11px !important;
  box-shadow: 0 7px 20px #ff174f20;
}

.features {
  max-width: 565px;
  margin: 12px auto !important;
  gap: 7px !important;
}

.feature {
  flex: 1;
  background: #130a11 !important;
  border: 1px solid #48202f !important;
  border-radius: 11px !important;
  color: #fff !important;
  padding: 15px 5px !important;
}

.feature span {
  color: #b9aab4 !important;
}

.social {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.social a {
  background: #170a14 !important;
  color: #fff !important;
  border: 1px solid #512033 !important;
  border-radius: 25px !important;
}

footer {
  color: #9c8998 !important;
}

#niaziBanner {
  max-width: 565px;
  width: calc(100% - 24px);
  margin: 12px auto;
  padding: 2px;
  border-radius: 13px;
  background: linear-gradient(100deg, #ff174f, #8d26d5);
}

#niaziBanner .inner {
  background: #130a11;
  border-radius: 11px;
  text-align: center;
  padding: 17px 8px;
}

#niaziBanner .brand {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

#niaziBanner .brand span {
  color: #ff386b;
}

#niaziBanner .tag {
  color: #c5aebb;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 7px;
}

@media (max-width: 480px) {
  header { padding-top: 25px !important; }
  .logo { font-size: 25px !important; }
  .box { padding: 20px 13px !important; }
  .title { font-size: 21px !important; }
  .mode button { font-size: 10px; padding: 11px 3px !important; }
  .features { width: calc(100% - 24px); }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Broken external banner ko hata kar built-in banner lagao
  document.querySelectorAll("img").forEach(function (img) {
    const text = (
      (img.alt || "") + " " +
      (img.src || "")
    ).toLowerCase();

    if (text.includes("banner")) {
      const banner = document.createElement("div");
      banner.id = "niaziBanner";
      banner.innerHTML = `
        <div class="inner">
          <div class="brand">MIAN X <span>NIAZI</span></div>
          <div class="tag">FAST • SIMPLE • MOBILE FRIENDLY</div>
        </div>`;
      img.replaceWith(banner);
    }
  });

  // Agar banner image maujood hi nahi, to khud add kar do
  if (!document.getElementById("niaziBanner")) {
    const banner = document.createElement("div");
    banner.id = "niaziBanner";
    banner.innerHTML = `
      <div class="inner">
        <div class="brand">MIAN X <span>NIAZI</span></div>
        <div class="tag">FAST • SIMPLE • MOBILE FRIENDLY</div>
      </div>`;

    const container = document.querySelector(".container");
    if (container) container.after(banner);
  }
});
</script>
</body>
</html>
