<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MIAN X NIAZI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
  min-height:100vh;
  overflow-x:hidden;
}

/* RGB BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:-30%;
  z-index:-3;
  background:
    radial-gradient(circle at 10% 20%,#ff0055,transparent 25%),
    radial-gradient(circle at 90% 20%,#00eaff,transparent 25%),
    radial-gradient(circle at 50% 90%,#7d00ff,transparent 28%),
    radial-gradient(circle at 10% 90%,#00ff88,transparent 22%);
  filter:blur(70px);
  opacity:.22;
  animation:bgMove 8s ease-in-out infinite alternate;
}

@keyframes bgMove{
  from{
    transform:scale(1) rotate(0deg);
  }
  to{
    transform:scale(1.12) rotate(8deg);
  }
}

/* CODING RAIN */
#codeRain{
  position:fixed;
  inset:0;
  z-index:-2;
  overflow:hidden;
  pointer-events:none;
  opacity:.12;
}

.code{
  position:absolute;
  top:-200px;
  font-family:monospace;
  font-size:10px;
  line-height:16px;
  font-weight:bold;
  white-space:pre;
  animation:fall linear infinite;
  text-shadow:0 0 7px currentColor;
}

@keyframes fall{
  from{
    transform:translateY(-200px);
  }
  to{
    transform:translateY(125vh);
  }
}

/* HEADER */
header{
  text-align:center;
  padding:24px 15px 8px;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
  animation:logoRGB 3s linear infinite;
}

@keyframes logoRGB{
  0%{
    color:#ff0055;
    text-shadow:0 0 10px #ff0055;
  }
  33%{
    color:#00eaff;
    text-shadow:0 0 10px #00eaff;
  }
  66%{
    color:#7d00ff;
    text-shadow:0 0 10px #7d00ff;
  }
  100%{
    color:#ff0055;
    text-shadow:0 0 10px #ff0055;
  }
}

.subtitle{
  color:#777;
  font-size:11px;
  margin-top:4px;
}

/* MODE */
.mode{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:15px 10px;
}

.mode button{
  border:2px solid #ddd;
  background:#fff;
  color:#111;
  padding:8px 18px;
  border-radius:25px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.mode button.active{
  color:#fff;
  border-color:transparent;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #ff00aa,
      #7d00ff,
      #00eaff,
      #00ff88,
      #ffea00,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
  box-shadow:0 0 12px #00eaff55;
}

@keyframes rgb{
  0%{
    background-position:0%;
  }
  100%{
    background-position:400%;
  }
}

/* CONTAINER */
.container{
  width:92%;
  max-width:620px;
  margin:auto;
}

.box{
  position:relative;
  background:rgba(255,255,255,.96);
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 30px #00000012;
}

.box::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-1;
  border-radius:22px;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #7d00ff,
      #00eaff,
      #00ff88,
      #ffea00,
      #ff0055
    );
  background-size:400%;
  animation:rgb 5s linear infinite;
}

/* TITLE */
.title{
  text-align:center;
  font-size:21px;
  font-weight:900;
  margin-bottom:5px;
}

.desc{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-bottom:15px;
}

/* FORM */
.form{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.inputRow{
  display:flex;
  gap:5px;
  width:100%;
}

input{
  flex:1;
  min-width:0;
  padding:12px;
  border:2px solid #ddd;
  border-radius:10px;
  outline:none;
  background:#fff;
  color:#111;
  font-size:12px;
}

input:focus{
  border-color:#00d9ff;
  box-shadow:0 0 10px #00eaff44;
}

/* PASTE CLEAR */
.smallBtn{
  border:1px solid #ccc;
  background:#111;
  color:#fff;
  border-radius:9px;
  padding:0 10px;
  font-size:9px;
  font-weight:bold;
  cursor:pointer;
}

.smallBtn:hover{
  background:#333;
}

/* DOWNLOAD */
.downloadBtn{
  display:none;
  width:115px;
  height:34px;
  margin:auto;
  border:0;
  border-radius:9px;
  background:#111;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.downloadBtn.show{
  display:block;
}

.downloadBtn::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #7d00ff,
      #00eaff,
      #00ff88,
      #ffea00,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

/* MESSAGE */
.message{
  display:none;
  margin-top:10px;
  padding:9px;
  border-radius:9px;
  text-align:center;
  background:#fff1f1;
  color:#d00000;
  font-size:10px;
}

.message.show{
  display:block;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  padding:17px;
  color:#7d00ff;
  font-size:11px;
  font-weight:bold;
}

.loading.show{
  display:block;
}

/* RESULT */
.result{
  display:none;
  margin-top:16px;
}

.result.show{
  display:block;
}

.videoBox{
  background:#000;
  border-radius:13px;
  overflow:hidden;
  border:2px solid #222;
}

video{
  width:100%;
  display:block;
  max-height:600px;
  background:#000;
}

/* INFO */
.info{
  padding:10px 2px;
}

.info h3{
  font-size:14px;
}

.info p{
  color:#777;
  font-size:10px;
  margin-top:3px;
}

/* ACTION BUTTONS */
.buttons{
  display:flex;
  gap:7px;
}

.action{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  border-radius:9px;
  background:#111;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.action::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #7d00ff,
      #00eaff,
      #00ff88,
      #ffea00,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.action span{
  position:relative;
  z-index:2;
}

/* SOCIAL RGB */
.social{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.social a{
  position:relative;
  overflow:hidden;
  color:#fff;
  text-decoration:none;
  padding:9px 17px;
  border-radius:22px;
  font-size:10px;
  font-weight:bold;
  background:#111;
}

.social a::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #ff00aa,
      #7d00ff,
      #00eaff,
      #00ff88,
      #ffea00,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.social a span{
  position:relative;
  z-index:2;
}

/* IMAGE */
.photo{
  width:100%;
  display:block;
  border-radius:15px;
  border:2px solid #ddd;
}

/* FEATURES */
.features{
  width:92%;
  max-width:750px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.feature{
  background:rgba(255,255,255,.94);
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px 7px;
  text-align:center;
}

.feature b{
  display:block;
  font-size:11px;
  margin-bottom:4px;
}

.feature span{
  color:#777;
  font-size:9px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:10px;
}

/* MOBILE */
@media(max-width:600px){

  .logo{
    font-size:25px;
  }

  .box{
    padding:17px 13px;
  }

  .inputRow{
    display:grid;
    grid-template-columns:1fr auto auto;
  }

  .smallBtn{
    padding:0 9px;
  }

  .features{
    grid-template-columns:1fr 1fr 1fr;
  }

  .feature{
    padding:12px 4px;
  }
}
</style>
</head>

<body>

<!-- CODING RAIN -->
<div id="codeRain"></div>

<header>

  <div class="logo">
    MIAN X NIAZI
  </div>

  <div class="subtitle">
    TikTok & Instagram Downloader
  </div>

</header>


<!-- MODE BUTTONS -->
<div class="mode">

  <button
    id="tikMode"
    class="active"
    onclick="changeMode('tiktok')">
    🎵 TikTok
  </button>

  <button
    id="insMode"
    onclick="changeMode('instagram')">
    📸 Instagram
  </button>

</div>


<div class="container">

<div class="box">

  <div
    class="title"
    id="title">
    TikTok Downloader
  </div>

  <div
    class="desc"
    id="desc">
    Paste your TikTok video link
  </div>


  <form
    id="downloadForm"
    class="form">

    <div class="inputRow">

      <input
        id="url"
        type="text"
        autocomplete="off"
        placeholder="Paste TikTok link..."
      >

      <button
        type="button"
        class="smallBtn"
        id="pasteBtn">
        PASTE
      </button>

      <button
        type="button"
        class="smallBtn"
        id="clearBtn">
        CLEAR
      </button>

    </div>


    <!-- SMALL DOWNLOAD BUTTON -->
    <button
      type="submit"
      id="downloadBtn"
      class="downloadBtn">

      <span>DOWNLOAD</span>

    </button>

  </form>


  <div
    id="message"
    class="message">
  </div>


  <div
    id="loading"
    class="loading">
    ⚡ Processing...
  </div>


  <div
    id="result"
    class="result">

    <div class="videoBox">

      <video
        id="video"
        controls
        playsinline>
      </video>

    </div>


    <div class="info">

      <h3 id="videoTitle">
        Video
      </h3>

      <p id="author"></p>

    </div>


    <div class="buttons">

      <button
        id="videoBtn"
        class="action">
        <span>⬇ VIDEO</span>
      </button>

      <button
        id="hdBtn"
        class="action">
        <span>⚡ HD</span>
      </button>

      <button
        id="mp3Btn"
        class="action">
        <span>🎵 MP3</span>
      </button>

    </div>

  </div>

</div>

</div>


<!-- RGB SOCIAL BUTTONS -->
<div class="social">

  <a
    href="https://www.tiktok.com/@niazimd2?_r=1&_t=ZS-99qIICgqU2W"
    target="_blank"
    rel="noopener">

    <span>🎵 TikTok</span>

  </a>


  <a
    href="https://wa.me/923220225993"
    target="_blank"
    rel="noopener">

    <span>💬 WhatsApp</span>

  </a>

</div>


<!-- NEW IMAGE -->
<div class="container">

  <img
    class="photo"
    src="https://cdn.phototourl.com/free/2026-09-18-3c8925d4-2f2c-43ed-b72c-b04cb29ef866.png"
    alt="MIAN X NIAZI">

</div>


<!-- FEATURES -->
<div class="features">

  <div class="feature">
    <b>⚡ FAST</b>
    <span>Fast processing</span>
  </div>

  <div class="feature">
    <b>📱 MOBILE</b>
    <span>Mobile friendly</span>
  </div>

  <div class="feature">
    <b>🆓 FREE</b>
    <span>Free to use</span>
  </div>

</div>


<footer>
  © 2026 MIAN X NIAZI
</footer>


<script>

/* ================= CODING RAIN ================= */

const rain =
document.getElementById("codeRain");

const words=[
  "MIAN X NIAZI",
  "01010101",
  "DOWNLOAD",
  "TIKTOK",
  "INSTAGRAM",
  "VIDEO",
  "API",
  "MIAN_X_NIAZI",
  "10101010",
  "CODE",
  "</>",
  "const",
  "async",
  "function"
];

for(let i=0;i<55;i++){

  const d=
    document.createElement("div");

  d.className="code";

  d.innerText=
    Array.from(
      {length:4+Math.floor(Math.random()*7)},
      ()=>{
        return words[
          Math.floor(
            Math.random()*words.length
          )
        ];
      }
    ).join("\n");

  d.style.left=
    Math.random()*100+"%";

  d.style.animationDuration=
    (7+Math.random()*14)+"s";

  d.style.animationDelay=
    (-Math.random()*18)+"s";

  const colors=[
    "#ff0055",
    "#00eaff",
    "#7d00ff",
    "#00ff88",
    "#ffea00"
  ];

  d.style.color=
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  rain.appendChild(d);
}


/* ================= API ================= */

const INSTAGRAM_API=
"https://my-insta-api-seven.vercel.app/api/instagram?url=";

let mode="tiktok";
let data=null;


/* ================= MODE ================= */

function changeMode(newMode){

  mode=newMode;

  clearResult();
  hideMessage();

  document.getElementById("url").value="";

  document
    .getElementById("downloadBtn")
    .classList.remove("show");


  if(mode==="instagram"){

    document
      .getElementById("title")
      .innerText=
      "Instagram Downloader";

    document
      .getElementById("desc")
      .innerText=
      "Paste your Instagram Reel link";

    document
      .getElementById("url")
      .placeholder=
      "Paste Instagram link...";

    document
      .getElementById("tikMode")
      .classList.remove("active");

    document
      .getElementById("insMode")
      .classList.add("active");

  }else{

    document
      .getElementById("title")
      .innerText=
      "TikTok Downloader";

    document
      .getElementById("desc")
      .innerText=
      "Paste your TikTok video link";

    document
      .getElementById("url")
      .placeholder=
      "Paste TikTok link...";

    document
      .getElementById("insMode")
      .classList.remove("active");

    document
      .getElementById("tikMode")
      .classList.add("active");
  }
}


/* ================= INPUT ================= */

document
.getElementById("url")
.addEventListener("input",function(){

  const value=
    this.value.trim();

  const btn=
    document.getElementById("downloadBtn");

  if(value){

    btn.classList.add("show");

  }else{

    btn.classList.remove("show");

    clearResult();
  }

});


/* ================= PASTE ================= */

document
.getElementById("pasteBtn")
.addEventListener("click",async()=>{

  try{

    const text=
      await navigator.clipboard.readText();

    if(!text){

      showMessage(
        "Clipboard empty hai."
      );

      return;
    }

    const input=
      document.getElementById("url");

    input.value=text;

    document
      .getElementById("downloadBtn")
      .classList.add("show");

    hideMessage();

    input.focus();

  }catch(error){

    showMessage(
      "Paste permission allow karo."
    );

  }

});


/* ================= CLEAR ================= */

document
.getElementById("clearBtn")
.addEventListener("click",()=>{

  document
    .getElementById("url")
    .value="";

  document
    .getElementById("downloadBtn")
    .classList.remove("show");

  clearResult();

  hideMessage();

  document
    .getElementById("url")
    .focus();

});


/* ================= FORM ================= */

document
.getElementById("downloadForm")
.addEventListener("submit",function(e){

  e.preventDefault();

  const url=
    document
      .getElementById("url")
      .value
      .trim();

  if(!url){

    showMessage(
      "Pehle link paste karo."
    );

    return;
  }

  if(mode==="instagram"){

    getInstagram(url);

  }else{

    getTikTok(url);

  }

});


/* ================= INSTAGRAM ================= */

async function getInstagram(url){

  setLoading(true);
  hideMessage();

  try{

    const response=
      await fetch(
        INSTAGRAM_API+
        encodeURIComponent(url)
      );

    const json=
      await response.json();

    if(
      !response.ok ||
      json.status!=="success" ||
      !json.data ||
      !json.data.url
    ){

      throw new Error(
        json.message ||
        "Video not found"
      );

    }

    data={
      video:json.data.url,
      hd:json.data.url,
      mp3:"",
      title:"Instagram Video",
      author:"Instagram",
      cover:json.data.thumbnail || ""
    };

    showResult();

    document
      .getElementById("hdBtn")
      .style.display="none";

    document
      .getElementById("mp3Btn")
      .style.display="none";

    setLoading(false);

  }catch(error){

    console.error(error);

    setLoading(false);

    showMessage(
      "Instagram video nahi mila."
    );

  }

}


/* ================= TIKTOK ================= */

async function getTikTok(url){

  setLoading(true);
  hideMessage();

  try{

    let response=
      await fetch(
        "https://tikwm.com/api/?url="+
        encodeURIComponent(url)
      );

    let json=
      await response.json();

    if(
      json &&
      json.data &&
      json.data.play
    ){

      const x=json.data;

      data={
        video:x.play,
        hd:x.hdplay || x.play,
        mp3:x.music || "",
        title:x.title || "TikTok Video",
        author:x.author?.nickname || "",
        cover:x.cover || ""
      };

      showResult();

      setLoading(false);

      return;
    }


    /* SECOND API */

    response=
      await fetch(
        "https://api.tiklydown.eu.org/api/download/v5?url="+
        encodeURIComponent(url)
      );

    json=
      await response.json();

    const x=
      json.result ||
      json.data ||
      json;

    const video=
      x.play ||
      x.video ||
      x.videoUrl ||
      x.noWatermark;

    if(!video){

      throw new Error(
        "TikTok video not found"
      );

    }

    data={
      video:video,
      hd:x.hdplay || video,
      mp3:x.music || "",
      title:x.title || "TikTok Video",
      author:x.author?.nickname || "",
      cover:x.cover || ""
    };

    showResult();

    setLoading(false);

  }catch(error){

    console.error(error);

    setLoading(false);

    showMessage(
      "TikTok video nahi mila."
    );

  }

}


/* ================= RESULT ================= */

function showResult(){

  const video=
    document.getElementById("video");

  video.pause();

  video.src=data.video;

  if(data.cover){

    video.poster=data.cover;

  }else{

    video.removeAttribute("poster");

  }

  video.load();


  document
    .getElementById("videoTitle")
    .innerText=data.title;


  document
    .getElementById("author")
    .innerText=
    data.author ?
    "@"+data.author :
    "";


  document
    .getElementById("result")
    .classList.add("show");


  document
    .getElementById("hdBtn")
    .style.display="block";


  document
    .getElementById("mp3Btn")
    .style.display=
    data.mp3 ?
    "block" :
    "none";

}


/* ================= VIDEO ================= */

document
.getElementById("videoBtn")
.addEventListener("click",()=>{

  if(data?.video){

    downloadFile(
      data.video,
      "MIAN-X-NIAZI-VIDEO.mp4"
    );

  }

});


/* ================= HD ================= */

document
.getElementById("hdBtn")
.addEventListener("click",()=>{

  if(data?.hd){

    downloadFile(
      data.hd,
      "MIAN-X-NIAZI-HD.mp4"
    );

  }

});


/* ================= MP3 ================= */

document
.getElementById("mp3Btn")
.addEventListener("click",()=>{

  if(data?.mp3){

    downloadFile(
      data.mp3,
      "MIAN-X-NIAZI-MP3.mp3"
    );

  }

});


/* ================= DOWNLOAD ================= */

async function downloadFile(url,filename){

  try{

    const response=
      await fetch(url);

    if(!response.ok){

      throw new Error(
        "Download failed"
      );

    }

    const blob=
      await response.blob();

    const blobURL=
      URL.createObjectURL(blob);

    const a=
      document.createElement("a");

    a.href=blobURL;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(blobURL);
    },3000);

  }catch(error){

    const a=
      document.createElement("a");

    a.href=url;

    a.target="_blank";

    a.rel="noopener";

    document.body.appendChild(a);

    a.click();

    a.remove();

  }

}


/* ================= HELPERS ================= */

function setLoading(show){

  document
    .getElementById("loading")
    .classList.toggle(
      "show",
      show
    );

}

function showMessage(text){

  const el=
    document.getElementById("message");

  el.innerText=text;

  el.classList.add("show");

}

function hideMessage(){

  document
    .getElementById("message")
    .classList.remove("show");

}

function clearResult(){

  data=null;

  const video=
    document.getElementById("video");

  video.pause();

  video.removeAttribute("src");
  video.removeAttribute("poster");

  video.load();

  document
    .getElementById("result")
    .classList.remove("show");

  document
    .getElementById("hdBtn")
    .style.display="block";

  document
    .getElementById("mp3Btn")
    .style.display="block";

}

</script>

</body>
</html>
