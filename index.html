<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MIAN X NIAZI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
  min-height:100vh;
  overflow-x:hidden;
}

/* RGB BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:-30%;
  z-index:-3;
  background:
    radial-gradient(circle at 10% 20%,#ff0055,transparent 25%),
    radial-gradient(circle at 90% 20%,#ff4b62,transparent 25%),
    radial-gradient(circle at 50% 90%,#b00020,transparent 28%),
    radial-gradient(circle at 10% 90%,#ff173d,transparent 22%);
  filter:blur(70px);
  opacity:.22;
  animation:bgMove 8s ease-in-out infinite alternate;
}

@keyframes bgMove{
  from{
    transform:scale(1) rotate(0deg);
  }
  to{
    transform:scale(1.12) rotate(8deg);
  }
}

/* CODING RAIN */
#codeRain{
  position:fixed;
  inset:0;
  z-index:-2;
  overflow:hidden;
  pointer-events:none;
  opacity:.12;
}

.code{
  position:absolute;
  top:-200px;
  font-family:monospace;
  font-size:10px;
  line-height:16px;
  font-weight:bold;
  white-space:pre;
  animation:fall linear infinite;
  text-shadow:0 0 7px currentColor;
}

@keyframes fall{
  from{
    transform:translateY(-200px);
  }
  to{
    transform:translateY(125vh);
  }
}

/* HEADER */
header{
  text-align:center;
  padding:24px 15px 8px;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
  animation:logoRGB 3s linear infinite;
}

@keyframes logoRGB{
  0%{
    color:#ff0055;
    text-shadow:0 0 10px #ff0055;
  }
  33%{
    color:#ff334f;
    text-shadow:0 0 10px #ff334f;
  }
  66%{
    color:#b00020;
    text-shadow:0 0 10px #b00020;
  }
  100%{
    color:#ff0055;
    text-shadow:0 0 10px #ff0055;
  }
}

.subtitle{
  color:#777;
  font-size:11px;
  margin-top:4px;
}

/* MODE */
.mode{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:15px 10px;
}

.mode button{
  border:2px solid #ddd;
  background:#fff;
  color:#111;
  padding:8px 14px;
  border-radius:25px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.mode button.active{
  color:#fff;
  border-color:transparent;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #ff173d,
      #b00020,
      #ff5a6e,
      #ff173d,
      #b00020,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
  box-shadow:0 0 12px #ff173d55;
}

@keyframes rgb{
  0%{
    background-position:0%;
  }
  100%{
    background-position:400%;
  }
}

/* CONTAINER */
.container{
  width:92%;
  max-width:620px;
  margin:auto;
}

.box{
  position:relative;
  background:rgba(255,255,255,.96);
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 30px #00000012;
}

.box::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-1;
  border-radius:22px;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #b00020,
      #ff5a6e,
      #ff173d,
      #b00020,
      #ff0055
    );
  background-size:400%;
  animation:rgb 5s linear infinite;
}

/* TITLE */
.title{
  text-align:center;
  font-size:21px;
  font-weight:900;
  margin-bottom:5px;
}

.desc{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-bottom:15px;
}

/* FORM */
.form{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.inputRow{
  display:flex;
  gap:5px;
  width:100%;
}

input{
  flex:1;
  min-width:0;
  padding:12px;
  border:2px solid #ddd;
  border-radius:10px;
  outline:none;
  background:#fff;
  color:#111;
  font-size:12px;
}

input:focus{
  border-color:#00d9ff;
  box-shadow:0 0 10px #ff173d44;
}

/* PASTE CLEAR */
.smallBtn{
  border:1px solid #ccc;
  background:#111;
  color:#fff;
  border-radius:9px;
  padding:0 10px;
  font-size:9px;
  font-weight:bold;
  cursor:pointer;
}

.smallBtn:hover{
  background:#333;
}

/* DOWNLOAD */
.downloadBtn{
  display:none;
  width:115px;
  height:34px;
  margin:auto;
  border:0;
  border-radius:9px;
  background:#111;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.downloadBtn.show{
  display:block;
}

.downloadBtn::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #b00020,
      #ff5a6e,
      #ff173d,
      #b00020,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

/* MESSAGE */
.message{
  display:none;
  margin-top:10px;
  padding:9px;
  border-radius:9px;
  text-align:center;
  background:#fff1f1;
  color:#d00000;
  font-size:10px;
}

.message.show{
  display:block;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  padding:17px;
  color:#7d00ff;
  font-size:11px;
  font-weight:bold;
}

.loading.show{
  display:block;
}

/* RESULT */
.result{
  display:none;
  margin-top:16px;
}

.result.show{
  display:block;
}

.videoBox{
  background:#000;
  border-radius:13px;
  overflow:hidden;
  border:2px solid #222;
}

video{
  width:100%;
  display:block;
  max-height:600px;
  background:#000;
}

/* INFO */
.info{
  padding:10px 2px;
}

.info h3{
  font-size:14px;
}

.info p{
  color:#777;
  font-size:10px;
  margin-top:3px;
}

/* ACTION BUTTONS */
.buttons{
  display:flex;
  gap:7px;
}

.action{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  border-radius:9px;
  background:#111;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.action::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #b00020,
      #ff5a6e,
      #ff173d,
      #b00020,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.action span{
  position:relative;
  z-index:2;
}

/* SOCIAL RGB */
.social{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.social a{
  position:relative;
  overflow:hidden;
  color:#fff;
  text-decoration:none;
  padding:9px 17px;
  border-radius:22px;
  font-size:10px;
  font-weight:bold;
  background:#111;
}

.social a::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #ff0055,
      #ff173d,
      #b00020,
      #ff5a6e,
      #ff173d,
      #b00020,
      #ff0055
    );
  background-size:400%;
  animation:rgb 4s linear infinite;
}

.social a span{
  position:relative;
  z-index:2;
}

/* IMAGE */
.photo{
  width:100%;
  display:block;
  border-radius:15px;
  border:2px solid #ddd;
}

/* FEATURES */
.features{
  width:92%;
  max-width:750px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.feature{
  background:rgba(255,255,255,.94);
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px 7px;
  text-align:center;
}

.feature b{
  display:block;
  font-size:11px;
  margin-bottom:4px;
}

.feature span{
  color:#777;
  font-size:9px;
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:10px;
}

/* MOBILE */
@media(max-width:600px){

  .logo{
    font-size:25px;
  }

  .box{
    padding:17px 13px;
  }

  .inputRow{
    display:grid;
    grid-template-columns:1fr auto auto;
  }

  .smallBtn{
    padding:0 9px;
  }

  .features{
    grid-template-columns:1fr 1fr 1fr;
  }

  .feature{
    padding:12px 4px;
  }
}

/* Inline preview + real download progress */
.linkPreview{margin-top:14px;padding:10px;background:#0c080d;border:1px solid #512033;border-radius:12px}
.previewLabel{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#ff7898;margin-bottom:8px}
.previewFrame{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:9px;background:#050505}
.previewFrame iframe{width:100%;height:100%;border:0}
.previewFrame video{width:100%;height:100%;object-fit:contain}
.downloadProgress{display:none;margin-top:14px}
.downloadProgress.show{display:block}
.progressTrack{height:8px;width:100%;background:#2b1726;border:1px solid #512033;border-radius:99px;overflow:hidden}
.progressFill{height:100%;width:0%;background:linear-gradient(90deg,#ff174f,#9225d5);transition:width .15s linear}
.progressText{font-size:11px;color:#d8c5d1;margin-top:7px;text-align:center}

/* RESTORE RED / PURPLE DARK DESIGN */
body{background:radial-gradient(ellipse at 10% 5%,#38202d,transparent 45%),radial-gradient(ellipse at 95% 90%,#350b35,transparent 48%),linear-gradient(135deg,#080609,#10121e 60%,#180819)!important;color:#fff!important}
.subtitle,.desc{color:#c0aeb9!important}
.mode button{background:#130a11!important;color:#fff!important;border:1px solid #48202f!important}
.mode button.active{background:linear-gradient(105deg,#ff174f,#9225d5)!important;border-color:transparent!important;animation:none!important}
.box{background:rgba(17,7,15,.97)!important;border:1px solid #512033!important;border-radius:20px!important;color:#fff!important;box-shadow:none!important}
.box::before{background:linear-gradient(100deg,#ff174f,#9225d5)!important;animation:none!important}
.title{color:#fff!important}.desc{color:#c0aeb9!important}
input{background:#090609!important;color:#fff!important;border:1px solid #512033!important}
input::placeholder{color:#887984!important}
.smallBtn,.paste-btn{background:#21101b!important;color:#fff!important;border:1px solid #512033!important}
.downloadBtn,.download-btn,.actionBtn{background:linear-gradient(100deg,#ff174f,#8d26d5)!important;color:#fff!important;border:0!important}
.feature{background:#130a11!important;border:1px solid #48202f!important;color:#fff!important}
.feature span,.feature small{color:#c0aeb9!important}
footer{color:#b9aab4!important}
#downloadProgress{background:#130a11!important;border-color:#512033!important}
@media(max-width:600px){.mode{gap:5px!important}.mode button{padding:10px 7px!important;font-size:10px!important}.box{padding:17px!important}}

</style>
</head>

<script>

/* ================= CODING RAIN ================= */

const rain =
document.getElementById("codeRain");

const words=[
  "MIAN X NIAZI",
  "01010101",
  "DOWNLOAD",
  "TIKTOK",
  "INSTAGRAM",
  "YOUTUBE",
  "VIDEO",
  "API",
  "MIAN_X_NIAZI",
  "10101010",
  "CODE",
  "</>",
  "const",
  "async",
  "function"
];

for(let i=0;i<18;i++){

  const d=
    document.createElement("div");

  d.className="code";

  d.innerText=
    Array.from(
      {length:4+Math.floor(Math.random()*7)},
      ()=>{
        return words[
          Math.floor(
            Math.random()*words.length
          )
        ];
      }
    ).join("\n");

  d.style.left=
    Math.random()*100+"%";

  d.style.animationDuration=
    (7+Math.random()*14)+"s";

  d.style.animationDelay=
    (-Math.random()*18)+"s";

  const colors=[
    "#ff0055",
    "#ff5a6e",
    "#b00020",
    "#ff173d",
    "#b00020"
  ];

  d.style.color=
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  rain.appendChild(d);
}


/* ================= API ================= */

const INSTAGRAM_API=
"https://my-insta-api-seven.vercel.app/api/instagram?url=";
const YOUTUBE_API=
"https://apis.davidcyriltech.my.id/download/savetube?url=";

let mode="tiktok";
let data=null;


/* ================= MODE ================= */

function changeMode(newMode){

  mode=newMode;
  clearResult();
  hideMessage();
  document.getElementById("url").value="";
  renderLinkPreview("");
  document.getElementById("downloadBtn").classList.remove("show");

  document.getElementById("tikMode").classList.toggle("active",mode==="tiktok");
  document.getElementById("insMode").classList.toggle("active",mode==="instagram");
  document.getElementById("ytMode").classList.toggle("active",mode==="youtube");

  const settings={
    tiktok:{title:"TikTok Downloader",desc:"Paste your TikTok video link",placeholder:"Paste TikTok link..."},
    instagram:{title:"Instagram Downloader",desc:"Paste your Instagram Reel link",placeholder:"Paste Instagram link..."},
    youtube:{title:"YouTube Downloader",desc:"Paste your YouTube video link",placeholder:"Paste YouTube link..."}
  }[mode];

  document.getElementById("title").innerText=settings.title;
  document.getElementById("desc").innerText=settings.desc;
  document.getElementById("url").placeholder=settings.placeholder;
}


/* ================= INPUT ================= */

document
.getElementById("url")
.addEventListener("input",function(){

  const value=
    this.value.trim();

  const btn=
    document.getElementById("downloadBtn");

  if(value){

    btn.classList.add("show");

  }else{

    btn.classList.remove("show");

    clearResult();
  }

});


/* ================= LIVE LINK PREVIEW ================= */
let previewTimer=null;
function getYouTubeId(url){
  try{const u=new URL(url); if(u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0]||''; if(u.hostname.includes('youtube.com')) return u.searchParams.get('v') || (u.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/)||[])[1] || ''; }catch(e){} return '';
}
function renderLinkPreview(raw){
  const wrap=document.getElementById('linkPreview');
  const frame=document.getElementById('previewFrame');
  frame.innerHTML='';
  const url=(raw||'').trim();
  if(!url){wrap.style.display='none';return;}
  let host=''; try{host=new URL(url).hostname.toLowerCase();}catch(e){wrap.style.display='none';return;}
  let embed='';
  if(host.includes('youtube.com')||host==='youtu.be'||host.endsWith('.youtube.com')){
    const id=getYouTubeId(url); if(id) embed='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0';
  } else if(host.includes('instagram.com')){
    const match=url.match(/instagram\.com\/(?:reel|p|tv)\/([^/?#]+)/i);
    if(match) embed='https://www.instagram.com/p/'+match[1]+'/embed';
  } else if(host.includes('tiktok.com')){
    const match=url.match(/\/video\/(\d+)/);
    if(match) embed='https://www.tiktok.com/player/v1/'+match[1]+'?music_info=1&description=1';
  }
  if(embed){
    const iframe=document.createElement('iframe'); iframe.src=embed; iframe.title='Video preview'; iframe.loading='lazy'; iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; iframe.allowFullscreen=true; frame.appendChild(iframe); wrap.style.display='block';
  }else{wrap.style.display='none';}
}
document.getElementById('url').addEventListener('input',function(){
  clearTimeout(previewTimer); const value=this.value.trim();
  previewTimer=setTimeout(()=>renderLinkPreview(value),350);
});
document.getElementById('pasteBtn').addEventListener('click',()=>setTimeout(()=>renderLinkPreview(document.getElementById('url').value),50));

/* ================= PASTE ================= */

document
.getElementById("pasteBtn")
.addEventListener("click",async()=>{

  try{

    const text=
      await navigator.clipboard.readText();

    if(!text){

      showMessage(
        "Clipboard empty hai."
      );

      return;
    }

    const input=
      document.getElementById("url");

    input.value=text;

    document
      .getElementById("downloadBtn")
      .classList.add("show");

    hideMessage();

    input.focus();

  }catch(error){

    showMessage(
      "Paste permission allow karo."
    );

  }

});


/* ================= CLEAR ================= */

document
.getElementById("clearBtn")
.addEventListener("click",()=>{

  document
    .getElementById("url")
    .value="";

  document
    .getElementById("downloadBtn")
    .classList.remove("show");

  clearResult();
  renderLinkPreview("");

  hideMessage();

  document
    .getElementById("url")
    .focus();

});


/* ================= FORM ================= */

document
.getElementById("downloadForm")
.addEventListener("submit",function(e){

  e.preventDefault();

  const url=
    document
      .getElementById("url")
      .value
      .trim();

  if(!url){
    showMessage("Pehle link paste karo.");
    return;
  }

  if(mode==="youtube" && !/(youtube\.com|youtu\.be)/i.test(url)){
    showMessage("Valid YouTube link paste karo.");
    return;
  }

  if(mode==="instagram"){
    getInstagram(url);
  }else if(mode==="youtube"){
    getYouTube(url);
  }else{
    getTikTok(url);
  }

});


/* ================= INSTAGRAM ================= */

async function getInstagram(url){

  setLoading(true);
  hideMessage();

  try{

    const response=
      await fetch(
        INSTAGRAM_API+
        encodeURIComponent(url)
      );

    const json=
      await response.json();

    if(
      !response.ok ||
      json.status!=="success" ||
      !json.data ||
      !json.data.url
    ){

      throw new Error(
        json.message ||
        "Video not found"
      );

    }

    data={
      video:json.data.url,

async function getTikTok(url){

  setLoading(true);
  hideMessage();

  try{

    let response=
      await fetch(
        "https://tikwm.com/api/?url="+
        encodeURIComponent(url)
      );

    let json=
      await response.json();

    if(
      json &&
      json.data &&
      json.data.play
    ){

      const x=json.data;

      data={
        video:x.play,
        hd:x.hdplay || x.play,
        mp3:x.music || "",
        title:x.title || "TikTok Video",
        author:x.author?.nickname || "",
        cover:x.cover || ""
      };

      showResult();

      setLoading(false);

      return;
    }


    /* SECOND API */

    response=
      await fetch(
        "https://api.tiklydown.eu.org/api/download/v5?url="+
        encodeURIComponent(url)
      );

    json=
      await response.json();

    const x=
      json.result ||
      json.data ||
      json;

    const video=
      x.play ||
      x.video ||
      x.videoUrl ||
      x.noWatermark;

    if(!video){

      throw new Error(
        "TikTok video not found"
      );

    }

    data={
      video:video,
      hd:x.hdplay || video,
      mp3:x.music || "",
      title:x.title || "TikTok Video",
      author:x.author?.nickname || "",
      cover:x.cover || ""
    };

    console.error(error);

    setLoading(false);

    showMessage(
      "TikTok video nahi mila."
    );

  }

}


/* ================= YOUTUBE ================= */

async function getYouTube(url){
  setLoading(true);
  hideMessage();
  try{
    // First use the same lightweight YouTube endpoint used in the earlier standalone build.
    // Keep SaveTube as a fallback, and do not retry several format spellings unnecessarily.
    const endpoints = [
      'https://youtube-downloader-api-mu.vercel.app/api/youtube?url=' + encodeURIComponent(url),
      YOUTUBE_API + encodeURIComponent(url) + '&format=720'
    ];
    let result = null;
    let lastError = 'Provider ne download link return nahi kiya.';

    function findMedia(obj, depth=0){
      if(!obj || depth > 7) return null;
      if(typeof obj === 'string') return null;
      if(Array.isArray(obj)){
        // Prefer the selected 720p format where the provider returns a list.
        const sorted = [...obj].sort((a,b)=>{
          const qa = parseInt(String(a?.quality||a?.format||a?.resolution||''),10)||0;
          const qb = parseInt(String(b?.quality||b?.format||b?.resolution||''),10)||0;
          return Math.abs(qa-720)-Math.abs(qb-720);
        });
        for(const item of sorted){ const found=findMedia(item,depth+1); if(found) return found; }
        return null;
      }
      if(typeof obj !== 'object') return null;
      const title=obj.title||obj.name||obj.videoTitle||obj.meta?.title||'YouTube Video';
      const author=obj.author||obj.channel||obj.uploader||obj.channelTitle||'YouTube';
      const cover=obj.thumbnail||obj.thumb||obj.image||obj.cover||obj.meta?.thumbnail||'';
      const directKeys=['download_url','downloadUrl','video_url','videoUrl','url','link','dl','download','fileUrl','directUrl'];
      for(const key of directKeys){
        const v=obj[key];
        if(typeof v==='string' && /^https?:\/\//i.test(v) && !/youtube\.com\/(?:watch|shorts|embed)/i.test(v)){
          return {video:v,hd:v,mp3:obj.audio_url||obj.audioUrl||obj.mp3_url||obj.mp3Url||'',title,author,cover};
        }
      }
      for(const key of ['formats','videos','video','data','result','response','media','links','files','downloadInfo']){
        if(obj[key]){const found=findMedia(obj[key],depth+1);if(found){
          found.title=found.title==='YouTube Video'?title:found.title;
          found.author=found.author==='YouTube'?author:found.author;
          found.cover=found.cover||cover;
          return found;
        }}
      }
      return null;
    }

    for(const endpoint of endpoints){
      try{
        const controller = new AbortController();
        const timeout = setTimeout(()=>controller.abort(), 12000);
        let response;
        try{response=await fetch(endpoint,{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timeout);}
        const raw=await response.text();
        let json;
        try{json=JSON.parse(raw);}catch{json={message:raw.slice(0,180)};}
        const found=findMedia(json);
        if(response.ok && found){result=found;break;}
        lastError=json?.message||json?.msg||json?.error||json?.details||json?.result?.message||('Provider HTTP '+response.status);
      }catch(e){
        lastError=e?.name==='AbortError'?'YouTube provider ne 12 seconds mein response nahi diya.':'YouTube provider connect nahi hua (network/CORS).';
      }
    }
    if(!result) throw new Error(String(lastError).slice(0,220));
    data=result;
    showResult();
    document.getElementById('hdBtn').style.display='none';
    document.getElementById('mp3Btn').style.display=data.mp3?'block':'none';
  }catch(error){
    console.error(error);
    showMessage('YouTube download link nahi mila: '+(error?.message||'provider unavailable'));
  }finally{
    setLoading(false);
  }
}

/* ================= DOWNLOAD ================= */

async function downloadFile(url,filename){
  const box=document.getElementById('downloadProgress');
  const fill=document.getElementById('progressFill');
  const text=document.getElementById('progressText');
  box.classList.add('show'); fill.style.width='0%';
  // Mobile browsers often block cross-origin fetch/blob downloads. Open the provider URL directly instead of waiting for a doomed fetch.
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 900);
  if(isMobile){
    text.textContent='Opening video download… If it plays instead, use the video player menu to Download/Save.';
    fill.style.width='35%';
    const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  text.textContent='Connecting to video server…';
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    let response;
    try{response=await fetch(url,{signal:controller.signal,mode:'cors'});}finally{clearTimeout(timeout);}
    if(!response.ok) throw new Error('HTTP '+response.status);
    const total=Number(response.headers.get('content-length'))||0;
    if(!response.body || !response.body.getReader){
      const blob=await response.blob(); saveBlob(blob,filename); fill.style.width='100%'; text.textContent='100% — Download ready'; return;
    }
    const reader=response.body.getReader(); const chunks=[]; let loaded=0;
    while(true){
      const part=await reader.read(); if(part.done) break; chunks.push(part.value); loaded+=part.value.length;
      if(total>0){const pct=Math.min(99,Math.round(loaded/total*100));fill.style.width=pct+'%';text.textContent=pct+'% — '+(loaded/1048576).toFixed(1)+' MB downloaded';}
      else{text.textContent=(loaded/1048576).toFixed(1)+' MB downloaded…';}
    }
    const blob=new Blob(chunks,{type:response.headers.get('content-type')||'video/mp4'});
    saveBlob(blob,filename); fill.style.width='100%'; text.textContent='100% — Download ready';
  }catch(error){
    text.textContent='Direct download browser ne block ki. Video link nayi tab mein khol rahe hain…';
    const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  }
}
function saveBlob(blob,filename){
  const blobURL=URL.createObjectURL(blob); const a=document.createElement('a');a.href=blobURL;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(blobURL),5000);
}


/* ================= HELPERS ================= */

function setLoading(show){

  document
    .getElementById("loading")
    .classList.toggle(
      "show",
      show
    );

}

function showMessage(text){

  const el=
    document.getElementById("message");

  el.innerText=text;

  el.classList.add("show");

}

function hideMessage(){

  document
    .getElementById("message")
    .classList.remove("show");

}

function clearResult(){

  data=null;
  const progress=document.getElementById("downloadProgress");
  if(progress) progress.classList.remove("show");

  const video=
    document.getElementById("video");

  video.pause();

  video.removeAttribute("src");
  video.removeAttribute("poster");

  video.load();

  document
    .getElementById("result")
    .classList.remove("show");

  document
    .getElementById("hdBtn")
    .style.display="block";

  document
    .getElementById("mp3Btn")
    .style.display="block";

}
