<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NO UPDATE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .rgb-text {
      font-size: 60px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;

      animation: rgb 2s linear infinite;

      text-shadow:
        0 0 5px currentColor,
        0 0 15px currentColor,
        0 0 30px currentColor,
        0 0 60px currentColor;
    }

    @keyframes rgb {
      0% {
        color: red;
        text-shadow: 0 0 10px red, 0 0 30px red, 0 0 60px red;
      }

      33% {
        color: lime;
        text-shadow: 0 0 10px lime, 0 0 30px lime, 0 0 60px lime;
      }

      66% {
        color: cyan;
        text-shadow: 0 0 10px cyan, 0 0 30px cyan, 0 0 60px cyan;
      }

      100% {
        color: red;
        text-shadow: 0 0 10px red, 0 0 30px red, 0 0 60px red;
      }
    }
  </style>
</head>

<body>

  <div class="rgb-text">NO UPDATE</div>

</body>
</html>
