<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIAZI-MD UPDATE TIMER</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 100%;
    padding: 20px;
}

/* Countdown */
#timer {
    font-size: clamp(55px, 14vw, 120px);
    font-weight: 900;
    letter-spacing: 5px;
    animation: rgbTimer 2s linear infinite;
}

/* RGB Timer */
@keyframes rgbTimer {
    0% {
        color: red;
        text-shadow:
            0 0 10px red,
            0 0 25px red,
            0 0 50px red;
    }

    33% {
        color: lime;
        text-shadow:
            0 0 10px lime,
            0 0 25px lime,
            0 0 50px lime;
    }

    66% {
        color: cyan;
        text-shadow:
            0 0 10px cyan,
            0 0 25px cyan,
            0 0 50px cyan;
    }

    100% {
        color: red;
        text-shadow:
            0 0 10px red,
            0 0 25px red,
            0 0 50px red;
    }
}

/* Bottom Text */
.message {
    margin-top: 45px;
    font-size: clamp(20px, 5vw, 38px);
    font-weight: 900;
    letter-spacing: 2px;
    animation: rgbMessage 2s linear infinite;
}

@keyframes rgbMessage {
    0% {
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000;
    }

    25% {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00, 0 0 25px #00ff00;
    }

    50% {
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff, 0 0 25px #00ffff;
    }

    75% {
        color: #ff00ff;
        text-shadow: 0 0 10px #ff00ff, 0 0 25px #ff00ff;
    }

    100% {
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000;
    }
}

/* Small labels */
.labels {
    margin-top: 8px;
    font-size: 14px;
    color: white;
    letter-spacing: 5px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">

    <div id="timer">10:00:00</div>

    <div class="labels">
        HOURS &nbsp;&nbsp; MINUTES &nbsp;&nbsp; SECONDS
    </div>

    <div class="message">
        WAIT FOR UPDATE BY NIAZI-MD
    </div>

</div>

<script>

let totalSeconds = 10 * 60 * 60; // 10 Hours

function countdown() {

    let hours = Math.floor(totalSeconds / 3600);

    let minutes = Math.floor((totalSeconds % 3600) / 60);

    let seconds = totalSeconds % 60;

    hours = String(hours).padStart(2, '0');
    minutes = String(minutes).padStart(2, '0');
    seconds = String(seconds).padStart(2, '0');

    document.getElementById("timer").textContent =
        hours + ":" + minutes + ":" + seconds;

    if (totalSeconds > 0) {
        totalSeconds--;
    } else {
        clearInterval(timerInterval);
        document.getElementById("timer").textContent = "00:00:00";
    }
}

countdown();

let timerInterval = setInterval(countdown, 1000);

</script>

</body>
</html>
